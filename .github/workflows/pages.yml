name: Publish documentation
# GitHub Pages serves this workflow's artifact, not the committed docs/ folder: `make docs` copies the ONNX Runtime
# Web loaders and WASM files (about 86 MB, gitignored) into docs/assets/ort/, and the demo's models need them.
# VERIFIED (2026-11-02): served from the branch, the site returned 404 for assets/ort/*.mjs and no model could load.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile
      - run: make docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
